damage.tooltip.characterLevel=Die Stufe des angreifenden Charakters. Sie beeinflusst die gegnerische VTD-Minderung, aber nicht die rohe Talentskalierung.
damage.tooltip.attack=Der für diesen Build eingetragene Gesamt-ANG. Er setzt sich normalerweise aus Basis-ANG, Waffen-ANG, Artefakten und aktiven ANG-Buffs zusammen.
damage.tooltip.elementalMastery=Die Elementarkunde des Builds plus aktive flache EK-Effekte aus der Effektivwert-Formel. Nefers Fähigkeit und Spezialfähigkeit skalieren direkt mit EK.
damage.tooltip.elementalDamageBonus=Nefers Dendro-Schadensbonus. Er gilt für direkte Dendro-Talentreffer; Lunar-Knospen-Schatten verwenden ihre eigene Reaktionsbonus-Schicht.
damage.tooltip.otherDamageBonus=Ein bearbeitbarer Sammelwert für zusätzliche direkte Schadensboni von Waffen, Artefakten, Teammitgliedern oder Kampfbedingungen.
damage.tooltip.critRate=Die KT des Builds. Sie beeinflusst den erwarteten Durchschnittsschaden, aber nicht die getrennten Ergebnisse „Kein KT“ und „KT“.
damage.tooltip.critDamage=Der KSCH des Builds. Er multipliziert einen Treffer, wenn dieser kritisch trifft.
damage.tooltip.normalTalentLevel=Gewählte Stufe des Standardangriffs. Sie bestimmt die Multiplikatorzeile aus Nefers mitgelieferten Talentdaten.
damage.tooltip.skillTalentLevel=Gewählte Stufe der Elementarfähigkeit. Sie bestimmt die Multiplikatorzeile aus Nefers mitgelieferten Talentdaten.
damage.tooltip.burstTalentLevel=Gewählte Stufe der Spezialfähigkeit. Sie bestimmt die Multiplikatorzeile aus Nefers mitgelieferten Talentdaten.
damage.tooltip.neferConstellation=Nefers freigeschaltete Sternbildstufe von C0 bis C6. Wenn vorhanden, liefert der importierte Kader den Startwert.
damage.tooltip.laumaConstellation=Laumas freigeschaltete Sternbildstufe. Nur hinterlegte Teameffekte bis zu dieser Stufe werden aktiviert.
damage.tooltip.nahidaConstellation=Nahidas freigeschaltete Sternbildstufe. Aktuell sind die für Nefer relevanten Effekte von C2 und C4 hinterlegt.
damage.tooltip.columbinaConstellation=Columbinas freigeschaltete Sternbildstufe. Jede Stufe trägt ihren eigenen Lunar-Reaktions-Elevationseffekt bei.
damage.tooltip.laumaElementalMastery=Laumas aktuelle Elementarkunde. „Chor der Natur“ und „Blasse Hymne“ verwenden diesen Wert unabhängig von Nefers Werten.
damage.tooltip.laumaSkillTalentLevel=Stufe von Laumas Elementarfähigkeit. Sie bestimmt die Dendro-WDS-Verringerung der Frosthain-Zuflucht.
damage.tooltip.laumaBurstTalentLevel=Stufe von Laumas Spezialfähigkeit. Sie bestimmt den durch „Blasse Hymne“ aus Laumas Elementarkunde addierten Basisschaden.
damage.tooltip.nahidaElementalMastery=Nahidas Elementarkunde für „Erleuchtetes Mitgefühl“ und den Dendro-Teambonus von „Aufsteigender Glanz“. Wenn ein anderes Truppenmitglied mehr EK besitzt, diesen höheren Wert eintragen.
damage.tooltip.nahidaMarkedOpponents=Anzahl naher Gegner mit Nahidas „Samen von Skandha“, maximal vier. Ihr C4-EK-Bonus folgt dieser Anzahl.
damage.tooltip.columbinaMaxHp=Columbinas max. LP. Ihr Mondzeichen-Segen addiert pro 1.000 max. LP 0,2 % Lunar-Reaktions-Basisschaden, maximal 7 %.
damage.tooltip.columbinaBurstTalentLevel=Stufe von Columbinas Spezialfähigkeit. Sie wählt den Lunar-Reaktions-Schadensbonus der Monddomäne.
damage.tooltip.moonlightEmBuff=Nefers passiver Effekt „A Wager of Moonlight“. Beim Erreichen oder Erneuern des dritten Schleier-Stapels gewährt er 100 Elementarkunde.
damage.tooltip.veilStacks=Aktuelle Schleier der Falschheit. Jeder Stapel gewährt 8 % Phantasmagorie-Schaden sowie den aktuellen stapelweisen Bonus der Spezialfähigkeit.
damage.tooltip.enemyLevel=Die Stufe des Zielgegners. Eine höhere Gegnerstufe verstärkt die VTD-Minderung gegen diesen Charakter.
damage.tooltip.enemyResistance=Der Dendro-Widerstand des Ziels. Negativer, normaler und hoher Widerstand verwenden unterschiedliche Formelzweige.
damage.tooltip.defenseReduction=Verringert die effektive VTD des Gegners vor der Schadensberechnung. Wird getrennt von ignorierter VTD angewendet.
damage.tooltip.defenseIgnore=Der Anteil gegnerischer VTD, den dieser Angriff ignoriert. Wird getrennt von der VTD-Verringerung angewendet.
damage.tooltip.talentScaling=Der exakte Multiplikator aus Nefers mitgelieferten Talentdaten auf der gewählten Talentstufe.
damage.tooltip.hitCount=Die Anzahl der Treffer dieser Schadensinstanz. Mehrfachtreffer multiplizieren den Talent-Basisschaden pro Treffer.
damage.tooltip.damageBonusMultiplier=Eins plus alle additiven Schadensboni dieses Treffers, einschließlich Dendro-, sonstiger direkter und trefferabhängiger Schleier-Boni.
damage.tooltip.defenseMultiplier=Gegnerische VTD-Minderung nach Charakterstufe, Gegnerstufe, VTD-Verringerung und ignorierter VTD.
damage.tooltip.resistanceMultiplier=Gegnerischer Dendro-WDS nach dem passenden Formelzweig für negativen, normalen oder hohen Widerstand.
damage.tooltip.critMultiplier=Der von KSCH beziehungsweise von KT und KSCH gemeinsam erzeugte Multiplikator für den erwarteten Durchschnittsschaden.
damage.tooltip.damageResult=Der resultierende direkte Dendro-Schaden dieses Treffers nach allen angezeigten Multiplikatoren. Reaktionsschaden ist nicht enthalten.
damage.formula.heading=So funktioniert die erste Berechnung
damage.formula.body=Der Basisschaden summiert alle ANG- und Elementarkunde-Skalierungen der gewählten Talentstufe. Danach folgen additive Dendro-, sonstige und Schleier-Schadensboni sowie die VTD- und Dendro-WDS-Multiplikatoren des Gegners.
damage.formula.average=Der Durchschnitt gewichtet kritische Treffer mit der KT. „Kein KT“ und „KT“ zeigen die beiden direkten Ergebnisse. Reaktionsschaden liegt außerhalb dieses ersten Umfangs.
damage.footer=Nefers Talentmultiplikatoren aus den mitgelieferten Charakterdaten, Version {0}. Ergebnisse werden auf den nächsten Schadenspunkt gerundet.

