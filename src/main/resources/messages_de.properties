damage.meta.elevationMultiplier=Lunar-Reaktions-Elevation
damage.tooltip.elevationMultiplier=Elevation ist ein eigener Basisschadensmultiplikator und kein gewöhnlicher Schadensbonus. Freigeschaltete Elevationswerte werden addiert und anschließend einmal mit dem Lunar-Reaktionsschaden multipliziert.
damage.v2.title={0} Schadensrechner V2 · Genshin Archiv
damage.v2.eyebrow=Handgepflegtes Formel-Labor · v2
damage.v2.heading={0} Schadensrechner V2
damage.v2.lead=Jede Schadensinstanz und jeder Effekt wird von Hand definiert und über den V2-Formelendpunkt ausgewertet.
damage.v2.scope=Nefers Talente, passive Effekte und Sternbilder mit Unterstützungseffekten von Lauma, Nahida und Columbina sowie den ausgerüsteten Artefaktsets des Teams. Bedingte Setboni verwenden die angezeigten Kampfannahmen. Berechnet wird ein einzelner Treffer, keine Rotation oder Gesamt-Team-DPS. Waffenpassive sind nicht enthalten. Der bisherige Rechner bleibt unverändert verfügbar.
