damage.v2.error=Der Berechnungsendpunkt hat kein verwendbares Ergebnis geliefert.
damage.v2.retry=Erneut versuchen
damage.v2.currentBuild=Markierte Eingaben verwenden deinen aktuellen Build vor Artefakt-Setboni. Aktive Setboni werden separat addiert und in den effektiven Werten und Formel-Tooltips angezeigt.
damage.v2.effectsHelp=Jeder Effekt verändert dieselben optionalen Formelschichten wie die Talenttreffer.
damage.v2.pipelineHeading=Eine gemeinsame Pipeline, pro Schadensinstanz hinterlegt
damage.v2.pipelineBody=Jede Karte zeigt ihre gespeicherten Basis-, Bonus-, VTD-, WDS- und zusätzlichen KT-Komponenten. Farbige Werte zeigen beim Darüberfahren oder Fokussieren ihre Quelle.
