damage.effect.dusklitEaves.name=Mondzeichen-Segen: Dämmrige Traufe
damage.effect.dusklitEaves.description=Jeder Punkt effektiver Elementarkunde erhöht den Basis-Schaden von Lunar-Knospen um 0,0175 %, maximal um 14 %. Auf C0 gelten die Schatten-Treffer der Phantasmagorie als Lunar-Knospen-Schaden.
damage.effect.dusklitEaves.impact=Wird nur auf als Lunar-Knospen markierte Schadensinstanzen angewendet.
damage.effect.aWager.name=Wette des Mondlichts
damage.effect.aWager.description=Geht davon aus, dass der 8-sekündige Buff durch das Erreichen oder Erneuern von 3 Schleiern aktiv ist und 100 Elementarkunde gewährt. Jeder aktuelle Schleier erhöht außerdem den Phantasmagorie-Schaden um 8 %.
damage.effect.aWager.impact=Benötigt die Teambedingung „Aufsteigender Glanz“. Schleier bleiben für Momentaufnahmen separat einstellbar.
damage.effect.daughter.name=Tochter von Staub und Sand
damage.effect.daughter.description=Nachdem ein Truppenmitglied Lunar-Knospen ausgelöst hat, verstärkt effektive Elementarkunde über 500 die zusätzliche Tau-Bereitstellung pro 100 Punkte um 10 %, maximal um 50 %.
damage.effect.daughter.impact=Ressourcen- und Rotationseffekt; multipliziert keinen aufgeführten Treffer direkt.
damage.effect.ascendant.name=Mondzeichen: Aufsteigender Glanz
damage.effect.ascendant.description=Geht davon aus, dass die Truppe „Aufsteigender Glanz“ erreicht und dadurch Samen des Trugs sowie Nefers „Wette des Mondlichts“ ermöglicht.
damage.effect.ascendant.impact=Für Teams ohne „Aufsteigender Glanz“ ausschalten; abhängige Effekte werden automatisch inaktiv.
damage.effect.laumaFrostgrove.name=WDS-Verringerung der Frosthain-Zuflucht
damage.effect.laumaFrostgrove.description=Wenn Laumas Fähigkeit oder die Frosthain-Zuflucht trifft, wird der Dendro-WDS des Ziels verringert. Der Wert folgt Laumas aktueller Fähigkeitsstufe.
damage.effect.laumaFrostgrove.impact=Wird im WDS-Schritt auf jede angezeigte Dendro-Schadensinstanz angewendet.
damage.effect.laumaLight.name=Licht für die frostige Nacht
damage.effect.laumaLight.description=Bei „Aufsteigender Glanz“ erhalten Truppenmitglieder 10 % KT und 20 % KSCH für Lunar-Knospen-Schaden.
damage.effect.laumaLight.impact=Wird nur auf als Lunar-Knospen markierte Schatten-Treffer angewendet.
damage.effect.laumaNature.name=Mondzeichen-Segen: Chor der Natur
damage.effect.laumaNature.description=Jeder Punkt von Laumas Elementarkunde erhöht den Lunar-Knospen-Basisschaden um 0,0175 %, maximal um 14 %.
damage.effect.laumaNature.impact=Wird in der Basisschadensebene mit den Segen von Nefer und Columbina gestapelt.
damage.effect.laumaPaleHymn.name=Blasse Hymne
damage.effect.laumaPaleHymn.description=Laumas Spezialfähigkeit addiert Lunar-Knospen-Basisschaden anhand ihrer Elementarkunde. Pro angezeigtem Schatten-Treffer wird ein Hymnen-Stapel angenommen.
damage.effect.laumaPaleHymn.impact=Der talentstufenabhängige EK-Multiplikator wird vor Basis- und allgemeinen Lunar-Multiplikatoren addiert.
damage.effect.nahidaCompassion.name=Erleuchtetes Mitgefühl
damage.effect.nahidaCompassion.description=Im Schrein von Maya erhält Nefer 25 % der höchsten Elementarkunde der Truppe, maximal 250 EK.
damage.effect.nahidaCompassion.impact=Der Nahida-EK-Regler dient vorerst als Referenz für die höchste Truppen-EK.
damage.effect.nahidaNewMoon.name=Aufsteigender Glanz: Nahida wirkt
damage.effect.nahidaNewMoon.description=Nachdem Nahida ohne Mondzeichen Fähigkeit oder Spezialfähigkeit einsetzt, gewährt Dendro pro 100 EK 2,25 % Lunar-Reaktions-Schaden, maximal 36 %.
damage.effect.nahidaNewMoon.impact=Benötigt „Aufsteigender Glanz“ und ist nicht mit einem anderen Teambonus ohne Mondzeichen stapelbar.
damage.effect.nahidaDeepwood.name=Erinnerungen des tiefen Waldes · 4 Teile
damage.effect.nahidaDeepwood.description=Nimmt an, dass Nahida den 4-Teile-Effekt ausgelöst hat und den Dendro-WDS des Ziels 8 Sekunden lang um 30 % verringert.
damage.effect.nahidaDeepwood.impact=Ausrüstungsannahme; ausschalten, wenn Nahida ein anderes Artefaktset trägt.
damage.effect.columbinaDomain.name=Monddomäne
damage.effect.columbinaDomain.description=In Columbinas Spezialfähigkeitsfeld erhalten alle Truppenmitglieder einen Lunar-Reaktions-Schadensbonus anhand ihrer Talentstufe.
damage.effect.columbinaDomain.impact=Gilt für Nefers Lunar-Knospen-Schatten-Treffer, nicht für ihre direkten Dendro-Treffer.
damage.effect.columbinaMoonlight.name=Mondzeichen-Segen: Dir geliehenes Mondlicht
damage.effect.columbinaMoonlight.description=Je 1.000 max. LP von Columbina erhöhen den Lunar-Reaktions-Basisschaden um 0,2 %, bis 7 % bei 35.000 LP.
damage.effect.columbinaMoonlight.impact=Wird in der Basisschadensebene mit den Segen von Nefer und Lauma gestapelt.
damage.effect.columbinaDew.name=Gesetz des Neumonds · Mondkamm-Tau
damage.effect.columbinaDew.description=Während der Monddomäne kann Lunar-Knospen bis zu 3 Mondkamm-Tau erzeugen, die nach normalem Grünschimmer-Tau verbraucht werden.
damage.effect.columbinaDew.impact=Ressourcen- und Rotationseffekt; ermöglicht weitere Performances, multipliziert aber keinen einzelnen Treffer.
damage.effect.reliquary.name=Reliquiar der Wahrheit ausgerüstet
damage.effect.reliquary.description=Aktiviert das R1-Passiv „Essenz der Falschheit“ und addiert dessen bedingungslose 8 % KT.
damage.effect.reliquary.impact=Nur Passivwerte werden addiert. Basis-ANG und sekundären KS der Waffe in den Build-Werten einrechnen.
damage.effect.secret.name=Geheimnis der Lügen
damage.effect.secret.description=Geht davon aus, dass Nefer innerhalb der letzten 12 Sekunden ihre Elementarfähigkeit eingesetzt hat: +80 Elementarkunde. Bei gleichzeitig aktivem „Mond der Wahrheit“ werden daraus 120.
damage.effect.secret.impact=Benötigt ein ausgerüstetes „Reliquiar der Wahrheit“.
damage.effect.moon.name=Mond der Wahrheit
damage.effect.moon.description=Geht davon aus, dass Nefer innerhalb der letzten 4 Sekunden Lunar-Knospen-Schaden verursacht hat: +24 % KS. Bei gleichzeitig aktivem „Geheimnis der Lügen“ werden daraus 36 %.
damage.effect.moon.impact=Benötigt ein ausgerüstetes „Reliquiar der Wahrheit“.
