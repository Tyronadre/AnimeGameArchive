damage.formula.defenseIgnored=Bei Lunar-Reaktionsschaden nicht angewendet
damage.meta.lunarEmBonus=Lunar-Knospen-EK-Bonus
damage.tooltip.lunarEmBonus=Formel: ((6 × EK) ÷ (EK + 2.000)) × 100 %. Dieser Lunar-Knospen-Bonus verwendet Dendro-WDS und KT/KS, aber weder gegnerische VTD noch Dendro-Schadensbonus.
damage.effect.neferC1.name=C1 · Planning Breeds Success
damage.effect.neferC1.description=Addiert bei „Phantasm Performance“ Lunar-Knospen-Basisschaden in Höhe von 60 % von Nefers effektiver EK. Der aktive Schleier-Multiplikator verstärkt auch diesen Anteil.
damage.effect.neferC1.impact=Erscheint als flacher Basisschadensterm bei jedem Lunar-Knospen-Treffer von „Phantasm Performance“.
damage.effect.neferC2.name=C2 · Observation Feeds Strategy
damage.effect.neferC2.description=Erhöht das Schleierlimit auf 5. Bei 5 Schleiern gewährt „A Wager of Moonlight“ 200 statt 100 EK; für den Maximalzustand 5 Schleier wählen.
damage.effect.neferC2.impact=Addiert bei 5 Schleiern weitere 100 EK; der bestehende Schleier-Multiplikator erreicht 40 %.
damage.effect.neferC3.name=C3 · Deceit Cloaks the Truth
damage.effect.neferC3.description=Erhöht Nefers Elementarfähigkeit um 3 Stufen, maximal auf Stufe 15.
damage.effect.neferC3.impact=Verwendet nach dem Stufenbonus die effektive Multiplikatorzeile der Fähigkeit.
damage.effect.neferC4.name=C4 · Delusion Ensnares Reason
damage.effect.neferC4.description=Während Nefer im Schatten-Tanz auf dem Feld ist, wird der Dendro-WDS naher Gegner um 20 % verringert.
damage.effect.neferC4.impact=Wird in der WDS-Formel auf jede angezeigte Nefer-Schadensinstanz angewendet.
damage.effect.neferC5.name=C5 · Opportunity Hides in the Margins
damage.effect.neferC5.description=Erhöht Nefers Spezialfähigkeit um 3 Stufen, maximal auf Stufe 15.
damage.effect.neferC5.impact=Verwendet nach dem Stufenbonus die effektive Multiplikatorzeile der Spezialfähigkeit.
damage.effect.neferC6.name=C6 · Victory Flows from the Turning of Tides
damage.effect.neferC6.description=Ändert Nefers zweiten „Phantasm Performance“-Treffer zu 85 % EK Lunar-Knospen-Schaden, fügt einen Treffer mit 120 % EK hinzu und erhöht bei „Aufsteigender Glanz“ ihren Lunar-Knospen-Schaden um 15 % Elevation.
damage.effect.neferC6.impact=Ersetzt die ursprüngliche Karte des zweiten Treffers, zeigt zwei C6-Instanzen und wendet eine eigene ×1,15-Elevationsebene an.
damage.effect.laumaC2.name=Lauma C2 · Twine Warnings and Tales
damage.effect.laumaC2.description=„Blasse Hymne“ addiert weitere 400 % von Laumas EK als Lunar-Knospen-Basisschaden. Bei „Aufsteigender Glanz“ kommen 40 % Lunar-Knospen-Schadensbonus hinzu.
damage.effect.laumaC2.impact=Addiert einen flachen Basisschadensterm und einen additiven Lunar-Reaktions-Schadensbonus.
damage.effect.laumaC3.name=Lauma C3 · Spezialfähigkeit +3
damage.effect.laumaC3.description=Erhöht Laumas Spezialfähigkeit um 3 Stufen, maximal auf Stufe 15.
damage.effect.laumaC3.impact=Erhöht den talentstufenabhängigen Multiplikator von „Blasse Hymne“.
damage.effect.laumaC5.name=Lauma C5 · Elementarfähigkeit +3
damage.effect.laumaC5.description=Erhöht Laumas Elementarfähigkeit um 3 Stufen, maximal auf Stufe 15.
damage.effect.laumaC5.impact=Erhöht die Dendro-WDS-Verringerung der Frosthain-Zuflucht.
damage.effect.nahidaC2.name=Nahida C2 · The Root of All Fullness
damage.effect.nahidaC2.description=Von Nahida markierte Gegner erhalten Lunar-Knospen-Schaden mit 10 % mehr KT und 20 % mehr KSCH.
damage.effect.nahidaC2.impact=Gilt nur für direkte Lunar-Knospen-Instanzen und stapelt mit Laumas Bonus von 10 %/20 %.
damage.effect.nahidaC4.name=Nahida C4 · Stem of Manifest Inference
damage.effect.nahidaC4.description=Nahida erhält 100/120/140/160 EK, wenn 1/2/3/4 oder mehr markierte Gegner in der Nähe sind.
damage.effect.nahidaC4.impact=Aktualisiert Nahidas effektive EK, bevor ihre EK-Weitergabe an den aktiven Charakter berechnet wird.
damage.effect.columbinaC1.name=Columbina C1 · Radiance Over Blossoms and Peaks
damage.effect.columbinaC1.description=Erhöht den Lunar-Reaktionsschaden naher Truppenmitglieder um 1,5 % Elevation; der zusätzliche Unterbrechungswiderstand verändert keinen einzelnen Treffer.
damage.effect.columbinaC1.impact=Wird als eigene ×1,015-Lunar-Reaktions-Elevation angewendet.
damage.effect.columbinaC2.name=Columbina C2 · Not in Lone Splendor
damage.effect.columbinaC2.description=Nach „Gravity Interference“ erhält Columbina 40 % max. LP und der aktive Charakter EK in Höhe von 0,35 % ihrer effektiven max. LP. Lunar-Reaktionsschaden wird um 7 % erhöht.
damage.effect.columbinaC2.impact=Aktualisiert max. LP, Nefers EK, den Basisschadenbonus von „Moonlight, Lent Unto You“ und die eigene Elevationsebene.
damage.effect.columbinaC3.name=Columbina C3 · Dreamlike Glow
damage.effect.columbinaC3.description=Erhöht den Lunar-Reaktionsschaden naher Truppenmitglieder um 1,5 % Elevation. Die Fähigkeitsstufen betreffen Columbinas eigenen Schaden.
damage.effect.columbinaC3.impact=Addiert 1,5 Prozentpunkte zur eigenen Elevationsebene.
damage.effect.columbinaC4.name=Columbina C4 · Cloudveiled Ridges
damage.effect.columbinaC4.description=Erhöht den Lunar-Reaktionsschaden naher Truppenmitglieder um 1,5 % Elevation. Energie und persönlicher Gravity-Schaden liegen außerhalb von Nefers Trefferkarten.
damage.effect.columbinaC4.impact=Addiert 1,5 Prozentpunkte zur eigenen Elevationsebene.
damage.effect.columbinaC5.name=Columbina C5 · Silence Tending One Lone Song
damage.effect.columbinaC5.description=Erhöht die Spezialfähigkeit der Monddomäne um 3 Stufen und den Lunar-Reaktionsschaden um 1,5 % Elevation.
damage.effect.columbinaC5.impact=Erhöht den talentstufenabhängigen Lunar-Schadensbonus und addiert zur eigenen Elevationsebene.
damage.effect.columbinaC6.name=Columbina C6 · Through Darkness Led by Moonlight
damage.effect.columbinaC6.description=Nach Lunar-Knospen innerhalb der Monddomäne erhält der entsprechende Dendro-Schaden 8 Sekunden lang 80 % KSCH. Lunar-Reaktionsschaden wird um 7 % erhöht.
damage.effect.columbinaC6.impact=Addiert anwendbaren KSCH auf alle Nefer-Treffer und 7 Prozentpunkte Lunar-Knospen-Elevation.
