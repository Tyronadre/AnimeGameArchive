damage.v2.footer=Handgepflegte Formeln werden über den V2-Schadensendpunkt geladen. Der bisherige Rechner bleibt zum Vergleich unverändert.
damage.v2.meta.talentLevel=Talentstufe
damage.v2.tooltip.talentLevel=Wählt die passende Multiplikatorzeile aus den mitgelieferten Talentdaten des Charakters.
damage.v2.tooltip.talentScaling=Der exakte Multiplikator aus den mitgelieferten Talentdaten des Charakters auf der gewählten Talentstufe.
damage.v2.tooltip.elementalMastery=Die Elementarkunde dieses Builds einschließlich aktiver flacher EK-Effekte aus der Effektivwert-Berechnung.
damage.v2.tooltip.elementalDamageBonus=Der Elementar-Schadensbonus des Builds für direkte, elementar ausgerichtete Treffer. Eine Schadensart kann diese Schicht ausdrücklich auslassen.
damage.v2.tooltip.enemyResistance=Der Widerstand des Ziels gegen das Element dieses Treffers. Negativer, normaler und hoher Widerstand verwenden unterschiedliche Formelzweige.
damage.v2.tooltip.damageBonusMultiplier=Eins plus alle additiven Schadensboni dieses Treffers, einschließlich gemeinsamer Build-Werte und hinterlegter Instanzeffekte.
damage.v2.tooltip.resistanceMultiplier=Gegnerischer Elementarwiderstand nach Verringerungen und dem passenden Formelzweig für negativen, normalen oder hohen Widerstand.
damage.v2.type.direct=Dendro
damage.v2.tooltip.direct=Direkter Dendro-Talentschaden verwendet Dendro-Schadensbonus, gegnerische VTD-Minderung, Dendro-WDS und KT.
damage.v2.type.lunar=Lunar-Knospen
damage.v2.tooltip.lunar=Lunar-Knospen-Schaden verwendet seine hinterlegte Lunar-Schadensregel. In diesem Profil umgeht er gegnerische VTD und verwendet keinen Dendro-Schadensbonus.
