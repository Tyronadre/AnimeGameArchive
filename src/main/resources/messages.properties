damage.effect.dusklitEaves.name=Moonsign Benediction: Dusklit Eaves
damage.effect.dusklitEaves.description=Each point of effective EM increases Lunar-Bloom Base DMG by 0.0175%, up to 14%. At C0, the Shade hits of Phantasm Performance are Lunar-Bloom DMG.
damage.effect.dusklitEaves.impact=Applied only to damage instances tagged as Lunar-Bloom.
damage.effect.aWager.name=A Wager of Moonlight
damage.effect.aWager.description=Assumes the 8-second buff from reaching or refreshing 3 Veils is active, granting 100 EM. Each current Veil also increases Phantasm Performance DMG by 8%.
damage.effect.aWager.impact=Requires the Ascendant Gleam team condition. Veils remain separately adjustable for snapshot comparisons.
damage.effect.daughter.name=Daughter of the Dust and Sand
damage.effect.daughter.description=After a party member triggers Lunar-Bloom, effective EM above 500 strengthens the additional Verdant Dew provision by 10% per 100 EM, up to 50%.
damage.effect.daughter.impact=Resource and rotation effect; it does not directly multiply a listed hit.
damage.effect.ascendant.name=Moonsign: Ascendant Gleam
damage.effect.ascendant.description=Assumes the party reaches Ascendant Gleam, enabling Seeds of Deceit and Nefer's A Wager of Moonlight effects.
damage.effect.ascendant.impact=Turn this off for teams that do not reach Ascendant Gleam; dependent effects become inactive automatically.
damage.effect.laumaFrostgrove.name=Frostgrove Sanctuary RES reduction
damage.effect.laumaFrostgrove.description=When Lauma's Skill or Frostgrove Sanctuary hits, the target's Dendro RES is reduced. The value follows Lauma's current Skill level.
damage.effect.laumaFrostgrove.impact=Applied in the RES step to every displayed Dendro damage instance.
damage.effect.laumaLight.name=Light for the Frosty Night
damage.effect.laumaLight.description=At Ascendant Gleam, nearby party members gain 10% CRIT Rate and 20% CRIT DMG for Lunar-Bloom damage.
damage.effect.laumaLight.impact=Applied only to the Shade hits tagged as Lunar-Bloom.
damage.effect.laumaNature.name=Moonsign Benediction: Nature's Chorus
damage.effect.laumaNature.description=Each point of Lauma's Elemental Mastery increases Lunar-Bloom Base DMG by 0.0175%, up to 14%.
damage.effect.laumaNature.impact=Stacks in the Lunar-Bloom Base DMG layer with Nefer and Columbina's Benedictions.
damage.effect.laumaPaleHymn.name=Pale Hymn
damage.effect.laumaPaleHymn.description=Lauma's Burst adds flat Lunar-Bloom Base DMG based on her Elemental Mastery. One Pale Hymn stack is assumed for each listed Shade hit.
damage.effect.laumaPaleHymn.impact=The talent-level EM multiplier is added before Base DMG and general Lunar multipliers.
damage.effect.nahidaCompassion.name=Compassion Illuminated
damage.effect.nahidaCompassion.description=Inside the Shrine of Maya, Nefer gains 25% of the highest party member's Elemental Mastery, up to 250 EM.
damage.effect.nahidaCompassion.impact=The Nahida EM slider is used as the highest-party-EM reference for now.
damage.effect.nahidaNewMoon.name=Ascendant Gleam: Nahida cast
damage.effect.nahidaNewMoon.description=After non-Moonsign Nahida casts her Skill or Burst, Dendro grants 2.25% Lunar Reaction DMG Bonus per 100 EM, up to 36%.
damage.effect.nahidaNewMoon.impact=Requires Ascendant Gleam and does not stack with another non-Moonsign team bonus.
damage.effect.nahidaDeepwood.name=Deepwood Memories · 4-piece
damage.effect.nahidaDeepwood.description=Assumes Nahida has triggered the 4-piece effect, reducing the target's Dendro RES by 30% for 8 seconds.
damage.effect.nahidaDeepwood.impact=Equipment assumption; switch it off if Nahida is using a different artifact set.
damage.effect.columbinaDomain.name=Lunar Domain
damage.effect.columbinaDomain.description=Inside Columbina's Burst field, all party members gain Lunar Reaction DMG Bonus based on her Burst talent level.
damage.effect.columbinaDomain.impact=Applied to Nefer's Lunar-Bloom Shade hits, not her direct Dendro hits.
damage.effect.columbinaMoonlight.name=Moonsign Benediction: Moonlight, Lent Unto You
damage.effect.columbinaMoonlight.description=Every 1,000 Max HP Columbina has increases Lunar Reaction Base DMG by 0.2%, up to 7% at 35,000 HP.
damage.effect.columbinaMoonlight.impact=Stacks in the Lunar-Bloom Base DMG layer with Nefer and Lauma's Benedictions.
damage.effect.columbinaDew.name=Law of the New Moon · Moonridge Dew
damage.effect.columbinaDew.description=While Lunar Domain is active, Lunar-Bloom can generate up to 3 Moonridge Dew to be consumed after normal Verdant Dew.
damage.effect.columbinaDew.impact=Resource and rotation effect; it enables additional performances but does not multiply one listed hit.
damage.effect.reliquary.name=Reliquary of Truth equipped
damage.effect.reliquary.description=Enables the R1 Essence of Falsity passive and adds its unconditional 8% CRIT Rate.
damage.effect.reliquary.impact=Only passive stats are added. Include the weapon's Base ATK and secondary CRIT DMG in the build values.
damage.effect.secret.name=Secret of Lies
damage.effect.secret.description=Assumes Nefer used her Elemental Skill within 12 seconds, granting 80 EM. This becomes 120 EM while Moon of Truth is also active.
damage.effect.secret.impact=Requires Reliquary of Truth to be equipped.
damage.effect.moon.name=Moon of Truth
damage.effect.moon.description=Assumes Nefer dealt Lunar-Bloom DMG within 4 seconds, granting 24% CRIT DMG. This becomes 36% while Secret of Lies is also active.
damage.effect.moon.impact=Requires Reliquary of Truth to be equipped.
