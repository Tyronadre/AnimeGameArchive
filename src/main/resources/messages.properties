damage.model.lunarBloom=Lunar-Bloom
damage.formula.defenseIgnored=Not applied to Lunar Reaction DMG
damage.meta.lunarEmBonus=Lunar-Bloom EM Bonus
damage.tooltip.lunarEmBonus=Formula: ((6 × EM) ÷ (EM + 2,000)) × 100%. This Lunar-Bloom bonus uses Dendro RES and CRIT, but not enemy DEF or Dendro DMG Bonus.
damage.effect.neferC1.name=C1 · Planning Breeds Success
damage.effect.neferC1.description=Adds Lunar-Bloom Base DMG equal to 60% of Nefer's effective EM to Phantasm Performance. The active Veil multiplier also boosts this addition.
damage.effect.neferC1.impact=Added as a visible flat Base DMG term to each Lunar-Bloom Phantasm hit.
damage.effect.neferC2.name=C2 · Observation Feeds Strategy
damage.effect.neferC2.description=Raises the Veil limit to 5. At 5 Veils, A Wager of Moonlight grants 200 EM instead of 100; select 5 Veils to calculate the maximum state.
damage.effect.neferC2.impact=Adds the second 100 EM at 5 Veils; the existing per-Veil multiplier reaches 40%.
damage.effect.neferC3.name=C3 · Deceit Cloaks the Truth
damage.effect.neferC3.description=Increases Nefer's Elemental Skill talent level by 3, up to level 15.
damage.effect.neferC3.impact=Selects the effective Skill multiplier row after the +3 level increase.
damage.effect.neferC4.name=C4 · Delusion Ensnares Reason
damage.effect.neferC4.description=While Nefer is on-field in Shadow Dance, nearby opponents lose 20% Dendro RES.
damage.effect.neferC4.impact=Applied in the RES formula to every displayed Nefer damage instance.
damage.effect.neferC5.name=C5 · Opportunity Hides in the Margins
damage.effect.neferC5.description=Increases Nefer's Elemental Burst talent level by 3, up to level 15.
damage.effect.neferC5.impact=Selects the effective Burst multiplier row after the +3 level increase.
damage.effect.neferC6.name=C6 · Victory Flows from the Turning of Tides
damage.effect.neferC6.description=Converts Phantasm Performance's second Nefer hit to 85% EM Lunar-Bloom DMG, adds a 120% EM Lunar-Bloom hit, and elevates Nefer's Lunar-Bloom DMG by 15% at Ascendant Gleam.
damage.effect.neferC6.impact=Replaces the original second-hit card, reveals two C6 instances, and applies a separate ×1.15 Elevation layer.
damage.effect.laumaC2.name=Lauma C2 · Twine Warnings and Tales
damage.effect.laumaC2.description=Pale Hymn adds a further 400% of Lauma's EM as Lunar-Bloom Base DMG. At Ascendant Gleam, Lunar-Bloom DMG also gains 40% Bonus.
damage.effect.laumaC2.impact=Adds one flat Base DMG term and one additive Lunar Reaction DMG Bonus term.
damage.effect.laumaC3.name=Lauma C3 · Burst level +3
damage.effect.laumaC3.description=Increases Lauma's Elemental Burst talent level by 3, up to level 15.
damage.effect.laumaC3.impact=Raises the talent-level Pale Hymn multiplier used for every Lunar-Bloom hit.
damage.effect.laumaC5.name=Lauma C5 · Skill level +3
damage.effect.laumaC5.description=Increases Lauma's Elemental Skill talent level by 3, up to level 15.
damage.effect.laumaC5.impact=Raises Frostgrove Sanctuary's Dendro RES reduction.
damage.effect.nahidaC2.name=Nahida C2 · The Root of All Fullness
damage.effect.nahidaC2.description=Opponents marked by Nahida receive Lunar-Bloom DMG with 10% more CRIT Rate and 20% more CRIT DMG.
damage.effect.nahidaC2.impact=Scoped only to direct Lunar-Bloom instances and stacks with Lauma's 10%/20% buff.
damage.effect.nahidaC4.name=Nahida C4 · Stem of Manifest Inference
damage.effect.nahidaC4.description=Nahida gains 100/120/140/160 EM when 1/2/3/4 or more marked opponents are nearby.
damage.effect.nahidaC4.impact=Updates Nahida's effective EM before her active-character EM share is calculated.
damage.effect.columbinaC1.name=Columbina C1 · Radiance Over Blossoms and Peaks
damage.effect.columbinaC1.description=Elevates all nearby party members' Lunar Reaction DMG by 1.5%; its additional Lunar-Bloom interruption resistance does not alter one hit.
damage.effect.columbinaC1.impact=Applied as a separate ×1.015 Lunar Reaction Elevation multiplier.
damage.effect.columbinaC2.name=Columbina C2 · Not in Lone Splendor
damage.effect.columbinaC2.description=After Gravity Interference, Columbina gains 40% Max HP and the active character gains EM equal to 0.35% of her effective Max HP. Lunar Reaction DMG is elevated by 7%.
damage.effect.columbinaC2.impact=Updates Max HP, Nefer's EM, Moonlight Lent's Base DMG bonus, and the separate Elevation layer.
damage.effect.columbinaC3.name=Columbina C3 · Dreamlike Glow
damage.effect.columbinaC3.description=Elevates all nearby party members' Lunar Reaction DMG by 1.5%. The Skill-level increase affects Columbina's own damage, not Nefer's listed hits.
damage.effect.columbinaC3.impact=Adds 1.5 percentage points to the separate Elevation multiplier.
damage.effect.columbinaC4.name=Columbina C4 · Cloudveiled Ridges
damage.effect.columbinaC4.description=Elevates all nearby party members' Lunar Reaction DMG by 1.5%. Columbina's Energy and personal Gravity damage are outside Nefer's hit cards.
damage.effect.columbinaC4.impact=Adds 1.5 percentage points to the separate Elevation multiplier.
damage.effect.columbinaC5.name=Columbina C5 · Silence Tending One Lone Song
damage.effect.columbinaC5.description=Increases Lunar Domain's Burst talent level by 3 and elevates Lunar Reaction DMG by 1.5%.
damage.effect.columbinaC5.impact=Raises the talent-level Lunar DMG Bonus and adds to the separate Elevation multiplier.
damage.effect.columbinaC6.name=Columbina C6 · Through Darkness Led by Moonlight
damage.effect.columbinaC6.description=After Lunar-Bloom inside Lunar Domain, corresponding Dendro DMG gains 80% CRIT DMG for 8 seconds. Lunar Reaction DMG is elevated by 7%.
damage.effect.columbinaC6.impact=Adds scoped CRIT DMG to all Nefer hits and 7 percentage points to Lunar-Bloom Elevation.
