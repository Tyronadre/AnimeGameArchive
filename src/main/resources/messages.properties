damage.tooltip.characterLevel=The attacking character's level. It affects enemy defense mitigation, but not the talent's raw scaling.
damage.tooltip.attack=Total ATK entered for this build. It normally combines character base ATK, weapon ATK, artifacts, and active ATK buffs.
damage.tooltip.elementalMastery=Elemental Mastery entered for the build, plus active flat EM effects shown in the effective-stat formula. Nefer's Skill and Burst have direct EM scaling.
damage.tooltip.elementalDamageBonus=Nefer's Dendro DMG Bonus. It applies to direct Dendro talent hits, while Lunar-Bloom Shade damage uses its separate reaction bonus layer.
damage.tooltip.otherDamageBonus=An editable bucket for additional direct DMG Bonus effects from weapons, artifacts, teammates, or combat conditions.
damage.tooltip.critRate=CRIT Rate entered for the build. It affects average expected damage, but does not change the separate Non-CRIT or CRIT result.
damage.tooltip.critDamage=CRIT DMG entered for the build. It multiplies a hit when that hit is critical.
damage.tooltip.normalTalentLevel=Selected Normal Attack talent level. It chooses the multiplier row from Nefer's bundled talent data.
damage.tooltip.skillTalentLevel=Selected Elemental Skill talent level. It chooses the multiplier row from Nefer's bundled talent data.
damage.tooltip.burstTalentLevel=Selected Elemental Burst talent level. It chooses the multiplier row from Nefer's bundled talent data.
damage.tooltip.neferConstellation=Nefer's owned constellation rank from C0 to C6. Imported roster data supplies the initial value when available.
damage.tooltip.laumaConstellation=Lauma's owned constellation rank. It activates only the authored team effects at or below this rank.
damage.tooltip.nahidaConstellation=Nahida's owned constellation rank. C2 and C4 effects relevant to Nefer are currently authored.
damage.tooltip.columbinaConstellation=Columbina's owned constellation rank. Each unlocked rank contributes its separate Lunar Reaction Elevation effect.
damage.tooltip.laumaElementalMastery=Lauma's current Elemental Mastery. Nature's Chorus and Pale Hymn use this value independently of Nefer's stats.
damage.tooltip.laumaSkillTalentLevel=Lauma's Elemental Skill level. It determines Frostgrove Sanctuary's Dendro RES reduction.
damage.tooltip.laumaBurstTalentLevel=Lauma's Elemental Burst level. It determines the Pale Hymn base damage added from Lauma's Elemental Mastery.
damage.tooltip.nahidaElementalMastery=Nahida's Elemental Mastery used for Compassion Illuminated and the Dendro Ascendant Gleam team bonus. Set this to the party's highest EM when another member is higher.
damage.tooltip.nahidaMarkedOpponents=Number of nearby opponents marked by Nahida's Seeds of Skandha, capped at four. Her C4 EM gain follows this count.
damage.tooltip.columbinaMaxHp=Columbina's Max HP. Her Moonsign Benediction adds 0.2% Lunar Reaction Base DMG per 1,000 Max HP, up to 7%.
damage.tooltip.columbinaBurstTalentLevel=Columbina's Elemental Burst level. It selects Lunar Domain's Lunar Reaction DMG Bonus.
damage.tooltip.moonlightEmBuff=Nefer's A Wager of Moonlight passive. When active, reaching or refreshing the third Veil stack grants 100 Elemental Mastery.
damage.tooltip.veilStacks=Current Veils of Falsehood. Each stack adds 8% Phantasm Performance DMG and the Burst talent's current per-stack DMG Bonus.
damage.tooltip.enemyLevel=The target enemy's level. Higher enemy level increases defense mitigation against this character.
damage.tooltip.enemyResistance=The target's Dendro resistance. Negative, normal, and high resistance use different multiplier branches.
damage.tooltip.defenseReduction=Reduces the enemy's effective DEF before damage is calculated. It is applied separately from DEF ignore.
damage.tooltip.defenseIgnore=The portion of enemy DEF this attack ignores. It is applied separately from DEF reduction.
damage.tooltip.talentScaling=The exact multiplier from Nefer's bundled talent data at the selected talent level.
damage.tooltip.hitCount=The number of strikes represented by this damage instance. Multi-hit entries multiply the per-hit talent base.
damage.tooltip.damageBonusMultiplier=One plus every applicable additive DMG Bonus for this hit, including Dendro, other direct bonuses, and instance-specific Veil bonuses.
damage.tooltip.defenseMultiplier=Enemy defense mitigation after character level, enemy level, DEF reduction, and DEF ignore are applied.
damage.tooltip.resistanceMultiplier=Enemy Dendro resistance after the appropriate negative, normal, or high-resistance formula branch.
damage.tooltip.critMultiplier=The multiplier created by CRIT DMG, or by CRIT Rate and CRIT DMG together for average expected damage.
damage.tooltip.damageResult=The resulting direct Dendro damage for this hit after every displayed multiplier. Reaction damage is not included.
damage.formula.heading=How this first calculation works
damage.formula.body=Base damage sums every ATK and Elemental Mastery scaling term at the selected talent level. Additive Dendro, other, and Veil damage bonuses are then followed by enemy DEF and Dendro RES multipliers.
damage.formula.average=Average damage weights critical hits using CRIT Rate; Non-CRIT and CRIT show either direct outcome. Transformative and additive reaction damage is outside this first scope.
damage.footer=Nefer talent multipliers from bundled character data version {0}. Results are rounded to the nearest damage point.

