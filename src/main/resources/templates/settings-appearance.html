<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{settings.appearance.title}">Appearance &amp; language · Genshin Archive</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</head>
<body>
<header th:replace="~{fragments :: siteHeader('settings')}"></header>
<main class="dashboard-page settings-page">
    <section class="dashboard-hero dashboard-hero-today settings-hero">
        <div>
            <a class="settings-back-link" th:href="@{/settings}" th:text="#{settings.back}">← Settings</a>
            <h1 th:text="#{settings.appearance.title}">Appearance &amp; language</h1>
        </div>
    </section>
    <section class="settings-control-grid">
        <article class="settings-control-card">
            <h2 th:text="#{settings.appearance.theme}">Color theme</h2>
            <button th:replace="~{fragments :: themeToggle}"></button>
        </article>
        <article class="settings-control-card">
            <h2 th:text="#{settings.appearance.language}">Language</h2>
            <div th:replace="~{fragments :: languageSwitcher}"></div>
        </article>
    </section>
</main>
</body>
</html>
