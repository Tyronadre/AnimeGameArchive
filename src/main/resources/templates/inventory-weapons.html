<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{weapons.title}">Weapons · Genshin Archive</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</head>
<body>
<header th:replace="~{fragments :: siteHeader('inventory')}"></header>
<main class="inventory-page">
    <section class="inventory-intro compact-intro">
        <p class="eyebrow" th:text="#{inventory.good}">GOOD Inventory</p>
        <h1 th:text="#{inventory.weapons}">Weapons</h1>
        <p class="lead" th:text="${snapshot == null
            ? #messages.msg('inventory.import.first')
            : #messages.msg('weapons.summary', totalItems)}">Weapons</p>
    </section>
    <nav class="inventory-tabs">
        <a th:href="@{/inventory/items}" th:text="#{inventory.items}">Items</a>
        <a th:href="@{/inventory/missing}" th:text="#{inventory.missing}">Missing Materials</a>
        <a th:href="@{/inventory/artifacts}" th:text="#{inventory.artifacts}">Artifacts</a>
        <a th:href="@{/inventory/artifact-optimizer}"
           th:text="#{inventory.optimizer}">Optimizer</a>
        <a class="active" th:href="@{/inventory/weapons}" th:text="#{inventory.weapons}">Weapons</a>
    </nav>
    <section class="inventory-section" th:if="${snapshot != null}">
        <form class="inventory-search" th:action="@{/inventory/weapons}" method="get">
            <input type="search" name="query" th:value="${query}"
                   th:placeholder="#{weapons.search}" placeholder="Weapon or character…">
            <button type="submit" th:text="#{action.search}">Search</button>
        </form>
        <div class="weapon-table">
            <div class="weapon-row weapon-header">
                <span th:text="#{inventory.weapon}">Weapon</span>
                <span th:text="#{character.level}">Level</span>
                <span th:text="#{character.ascension}">Ascension</span>
                <span th:text="#{weapons.refinement}">Refinement</span>
                <span th:text="#{weapons.owner}">Owner</span>
            </div>
            <div class="weapon-row" th:each="weapon : ${weapons}">
                <div class="weapon-name-cell">
                    <div class="weapon-icon">
                        <img th:if="${weaponIcons[weapon.imageKey] != null}"
                             th:src="${weaponIcons[weapon.imageKey]}"
                             th:alt="${weapon.name}"
                             loading="lazy">
                    </div>
                    <strong>
                        <span th:if="${weapon.locked}">🔒 </span>
                        <span th:text="${weapon.name}">Weapon</span>
                    </strong>
                </div>
                <span th:text="${weapon.level}">90</span>
                <span th:text="${weapon.ascension}">6</span>
                <span th:text="${'R' + weapon.refinement}">R1</span>
                <span th:text="${weapon.location ?: '–'}">–</span>
            </div>
        </div>
        <nav class="pagination" th:if="${totalPages > 1}">
            <a th:if="${page > 0}"
               th:href="@{/inventory/weapons(page=${page - 1},query=${query})}"
               th:text="#{pagination.previous}">← Previous</a>
            <span th:text="#{pagination.page(${page + 1},${totalPages})}">Page 1</span>
            <a th:if="${page + 1 < totalPages}"
               th:href="@{/inventory/weapons(page=${page + 1},query=${query})}"
               th:text="#{pagination.next}">Next →</a>
        </nav>
    </section>
</main>
</body>
</html>
