<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{settings.title}">Settings · Genshin Archive</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</head>
<body>
<header th:replace="~{fragments :: siteHeader('settings')}"></header>
<main class="dashboard-page settings-page">
    <section class="dashboard-hero dashboard-hero-today settings-hero">
        <div><h1 th:text="#{settings.title}">Settings</h1></div>
    </section>
    <section class="settings-grid" aria-label="Settings">
        <a class="settings-card" th:href="@{/settings/character-priorities}">
            <span class="settings-card-icon" aria-hidden="true">◇</span>
            <span class="settings-card-copy">
                <h2 th:text="#{settings.priorities.title}">Character priorities</h2>
                <p th:text="#{settings.priorities.description}">Choose character and artifact goals for dashboard planning.</p>
            </span>
            <span class="settings-card-arrow" aria-hidden="true">→</span>
        </a>
        <a class="settings-card" th:href="@{/settings/appearance}">
            <span class="settings-card-icon" aria-hidden="true">◐</span>
            <span class="settings-card-copy">
                <h2 th:text="#{settings.appearance.title}">Appearance &amp; language</h2>
                <p th:text="#{settings.appearance.description}">Theme and language preferences.</p>
            </span>
            <span class="settings-card-arrow" aria-hidden="true">→</span>
        </a>
        <a class="settings-card" th:href="@{/settings/database}">
            <span class="settings-card-icon" aria-hidden="true">▤</span>
            <span class="settings-card-copy">
                <h2 th:text="#{nav.database}">Database</h2>
                <p th:text="#{settings.database.description}">Import and export player data.</p>
            </span>
            <span class="settings-card-arrow" aria-hidden="true">→</span>
        </a>
        <a class="settings-card" th:href="@{/settings/image-management}">
            <span class="settings-card-icon" aria-hidden="true">▧</span>
            <span class="settings-card-copy">
                <h2 th:text="#{nav.images}">Image management</h2>
                <p th:text="#{settings.images.description}">Manage image sources.</p>
            </span>
            <span class="settings-card-arrow" aria-hidden="true">→</span>
        </a>
    </section>
</main>
</body>
</html>
