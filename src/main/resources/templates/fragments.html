<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteHeader(activeSection)">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">✦</span>
        <span th:text="#{app.name}">Genshin Archive</span>
    </a>
    <nav class="header-actions" th:attr="aria-label=#{nav.main}">
        <a class="back-link" th:classappend="${activeSection == 'dashboard'} ? ' active' : ''"
           th:href="@{/}" th:text="#{nav.dashboard}">Dashboard</a>
        <a class="back-link" th:classappend="${activeSection == 'characters'} ? ' active' : ''"
           th:href="@{/characters}" th:text="#{nav.characters}">Characters</a>
        <a class="back-link" th:classappend="${activeSection == 'inventory'} ? ' active' : ''"
           th:href="@{/inventory}" th:text="#{nav.inventory}">Inventory</a>
        <a class="back-link" th:classappend="${activeSection == 'materials'} ? ' active' : ''"
           th:href="@{/materials}" th:text="#{nav.materials}">Materials</a>
        <a class="back-link" th:classappend="${activeSection == 'images'} ? ' active' : ''"
           th:href="@{/admin/images}" th:text="#{nav.images}">Image management</a>
    </nav>
    <div class="account-controls">
        <span class="account-name" th:text="${currentUser.name}">Player</span>
        <button th:replace="~{fragments :: themeToggle}"></button>
        <div th:replace="~{fragments :: languageSwitcher}"></div>
        <form th:unless="${desktopMode}" th:action="@{/logout}" method="post">
            <button type="submit" th:text="#{nav.logout}">Log out</button>
        </form>
    </div>
</header>

<button class="theme-toggle" type="button" th:fragment="themeToggle"
        data-theme-toggle aria-pressed="false"
        data-theme-dark-label="Switch to dark mode"
        data-theme-light-label="Switch to light mode"
        th:attr="data-theme-dark-label=#{theme.switch.dark},data-theme-light-label=#{theme.switch.light},
                 aria-label=#{theme.switch.dark},title=#{theme.switch.dark}">
    <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☀</span>
    <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">☾</span>
</button>

<div class="language-switcher" th:fragment="languageSwitcher">
    <label class="sr-only" for="language" th:text="#{language.label}">Language</label>
    <select id="language" th:attr="aria-label=#{language.label}"
            onchange="const url = new URL(window.location.href); url.searchParams.set('lang', this.value); window.location.assign(url);">
        <option value="en" th:selected="${#locale.language == 'en'}">EN</option>
        <option value="de" th:selected="${#locale.language == 'de'}">DE</option>
    </select>
</div>
</body>
</html>
