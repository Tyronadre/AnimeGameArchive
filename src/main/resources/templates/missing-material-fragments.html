<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="sourceItems(items)">
    <a class="source-material" th:each="materialItem : ${items}"
       th:classappend="${materialItem.needed == 0 ? ' covered' : ''}"
       th:href="@{/materials(materialId=${materialItem.id},includeUnowned=${includeUnowned})}"
       th:attr="data-material-item='true',data-material-id=${materialItem.id},
                data-name=${#strings.toLowerCase(materialItem.name)},
                data-category=${materialItem.category.name()}">
        <span class="source-material-icon">
            <img th:if="${materialItem.imageUrl != null}" th:src="${materialItem.imageUrl}"
                 th:alt="${materialItem.name}" loading="lazy" onerror="this.remove()">
        </span>
        <span class="source-material-copy">
            <strong th:text="${materialItem.name}">Teachings of Freedom</strong>
            <span class="source-material-counts">
                <span><small th:text="#{material.owned}">Owned</small>
                    <b data-material-value="owned"
                       th:text="${#numbers.formatInteger(materialItem.owned, 1, 'POINT')}">0</b></span>
                <span><small th:text="#{materials.keep}">Keep</small>
                    <b data-material-value="required"
                       th:text="${#numbers.formatInteger(materialItem.required, 1, 'POINT')}">0</b></span>
                <span data-material-balance
                      th:class="${materialItem.needed > 0 ? 'missing' : 'free'}">
                    <small data-material-balance-label
                           th:attr="data-missing-label=#{materials.stillNeeded},data-free-label=#{materials.freeToUse}"
                           th:text="${materialItem.needed > 0 ? #messages.msg('materials.stillNeeded') : #messages.msg('materials.freeToUse')}">Still need</small>
                    <b data-material-balance-value
                       th:text="${#numbers.formatInteger(materialItem.needed > 0 ? materialItem.needed : materialItem.freeToUse, 1, 'POINT')}">0</b>
                </span>
            </span>
            <span class="source-material-status" data-material-craftable-status
                  th:hidden="${materialItem.craftable <= 0}">
                <span class="craftable">
                    <small th:text="#{materials.canMake}">Can make</small>
                    <b data-material-value="craftable"
                       th:text="${#numbers.formatInteger(materialItem.craftable, 1, 'POINT')}">0</b>
                </span>
            </span>
        </span>
    </a>
</th:block>

<th:block th:fragment="gemFamilies(families)">
    <div class="boss-gemstone-row">
        <th:block th:each="gemFamily : ${families}" th:if="${gemFamily.topTier != null}"
                  th:with="gemstone=${gemFamily.topTier}">
            <a class="boss-gemstone"
               th:classappend="${gemstone.needed > 0 ? ' missing' : ''}"
               th:href="@{/materials(materialId=${gemstone.id},includeUnowned=${includeUnowned})}"
               th:attr="title=${gemstone.name},data-material-item='true',
                        data-material-id=${gemstone.id},
                        data-name=${#strings.toLowerCase(gemstone.name)},
                        data-category=${gemstone.category.name()}">
                <img th:if="${gemstone.imageUrl != null}" th:src="${gemstone.imageUrl}"
                     th:alt="${gemstone.name}" loading="lazy" onerror="this.remove()">
                <strong th:text="${gemFamily.name}">Agnidus Agate</strong>
                <span>
                    <small th:text="#{material.missing}">Missing</small>
                    <b data-material-value="needed"
                       th:text="${#numbers.formatInteger(gemstone.needed, 1, 'POINT')}">0</b>
                </span>
            </a>
        </th:block>
    </div>
</th:block>
</body>
</html>
