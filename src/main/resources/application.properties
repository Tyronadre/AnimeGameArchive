spring.application.name=GenshinApp
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_example
spring.datasource.username=springuser
spring.datasource.password=ThePassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Dynamically downloaded Genshin data is cached outside the packaged application.
genshin.content.cache-directory=${user.home}/.genshinapp/cache
genshin.content.character-api-url=https://genshin-db-api.vercel.app/api/v5
# Once per startup, compare core static genshin-db folders with the local database.
genshin.content.static-import-enabled=true
genshin.content.static-import-folders=artifacts,characters,constellations,domains,elements,materials,talents,weapons
genshin.content.static-import-fail-on-error=false
genshin.content.static-import-user-agent-version=0.1.4
genshin.content.fandom-image-base-url=https://static.wikia.nocookie.net/gensin-impact/images
genshin.content.hoyolab-wiki-api-url=https://sg-wiki-api.hoyolab.com/hoyowiki/wapi
genshin.content.hoyolab-wiki-enabled=true
genshin.content.connect-timeout=8s
genshin.content.request-timeout=20s

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.messages.fallback-to-system-locale=false
