spring.application.name=GenshinApp
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_example
spring.datasource.username=springuser
spring.datasource.password=ThePassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Dynamically downloaded media is cached outside the packaged application.
genshin.content.cache-directory=${user.home}/.genshinapp/cache
# HoYoWiki supplies the structured catalogue and detail data.
genshin.content.fandom-image-base-url=https://static.wikia.nocookie.net/gensin-impact/images
genshin.content.hoyolab-wiki-api-url=https://sg-wiki-api.hoyolab.com/hoyowiki/wapi
genshin.content.hoyolab-wiki-enabled=true
genshin.content.hoyolab-catalog-sync-enabled=true
# Canonical game item ids can be updated independently of the packaged app.
genshin.content.material-identity-catalog-url=https://raw.githubusercontent.com/Tyronadre/AnimeGameArchive/master/src/main/resources/data/material-identities.json
genshin.content.connect-timeout=8s
genshin.content.request-timeout=20s

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.messages.fallback-to-system-locale=false
